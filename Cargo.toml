[package]
name = "cf-void"
version = "5.0.0"
edition = "2021"
authors = ["CF-VOID Team"]
description = "CF-VOID v5.0 - Complete Offensive Security Platform"
license = "GPL-3.0"

[lib]
name = "cfvoid"
path = "src/lib.rs"

[[bin]]
name = "cf-void"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json", "cookies", "gzip", "brotli", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
scraper = "0.18"
regex = "1"
anyhow = "1"
thiserror = "1"
url = "2"
urlencoding = "2"
sha2 = "0.10"
base64 = "0.21"
md5 = "0.7"
sha1 = "0.10"
sha3 = "0.10"
bcrypt = "0.15"
ripemd = "0.1"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
socket2 = "0.5"
pnet = "0.35"
csv = "1.4"
libc = "0.2"
open = "5"

# TUI (Ratatui — replacement for deprecated tui 0.19)
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }

# Web GUI
axum = { version = "0.8", optional = true, features = ["ws"] }
tower-http = { version = "0.6", optional = true, features = ["cors", "fs"] }
tokio-tungstenite = { version = "0.26", optional = true }
tower = { version = "0.5", optional = true }

# System stats
sysinfo = { version = "0.30", features = ["multithread"] }

# Better error handling
color-eyre = "0.6"

# Process control for proxy testing
which = "5"
dirs = "5"

[features]
default = ["tui"]
tui = ["ratatui", "crossterm"]
web = ["axum", "tower-http", "tokio-tungstenite", "tower"]
full = ["tui", "web"]

[profile.release]
opt-level = 2
lto = false
panic = "abort"
strip = "symbols"
codegen-units = 16